<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Andar Bahar - Wallet</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            background:var(--tg-theme-bg-color,#0d0d1a);
            color:var(--tg-theme-text-color,#fff);
            min-height:100vh;padding:15px;padding-bottom:80px;
        }
        .container{max-width:420px;margin:0 auto;text-align:center;}
        h1{font-size:1.8em;margin-bottom:15px;background:linear-gradient(45deg,#0098ea,#00bcd4);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
        .wallet-card{
            background:rgba(0,152,234,0.1);border:2px solid #0098ea;border-radius:20px;
            padding:25px;margin-bottom:20px;
        }
        .wallet-icon{font-size:4em;margin-bottom:10px;}
        .wallet-address{font-family:monospace;font-size:.85em;color:#0098ea;word-break:break-all;margin:10px 0;}
        .wallet-balance{font-size:2em;font-weight:bold;color:#ffd700;margin:10px 0;}
        .wallet-balance span{font-size:.5em;color:#aaa;}
        .btn{
            padding:14px 30px;font-size:1em;font-weight:bold;border:none;border-radius:50px;
            cursor:pointer;color:#fff;width:100%;margin:8px 0;transition:.3s;
        }
        .btn:active{transform:scale(.95)}
        .btn-ton{background:linear-gradient(135deg,#0098ea,#00bcd4)}
        .btn-disconnect{background:rgba(244,67,54,0.2);border:1px solid #f44336;color:#f44336;}
        .btn-outline{background:transparent;border:2px solid rgba(255,255,255,0.3);color:#fff;}
        .divider{border:none;border-top:1px solid rgba(255,255,255,0.1);margin:15px 0;}
        .info-row{display:flex;justify-content:space-between;padding:10px 0;font-size:.9em;border-bottom:1px solid rgba(255,255,255,0.05);}
        .info-label{color:#888;}.info-value{color:#fff;font-weight:bold;}
        .tx-list{text-align:left;max-height:200px;overflow-y:auto;}
        .tx-item{display:flex;justify-content:space-between;padding:8px 10px;background:rgba(255,255,255,0.03);border-radius:8px;margin:5px 0;font-size:.8em;}
        .tx-send{color:#f44336}.tx-receive{color:#4caf50}
        .hidden{display:none!important}
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.9);display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid rgba(255,255,255,0.1);z-index:999;}
        .nav-item{text-align:center;color:#888;font-size:.75em;cursor:pointer;transition:.3s;text-decoration:none;flex:1;}
        .nav-item.active{color:#0098ea;}
        .nav-icon{font-size:1.5em;display:block;margin-bottom:2px;}
    </style>
</head>
<body>
<div class="container">
    <h1>💎 TON Wallet</h1>

    <!-- Not Connected -->
    <div id="notConnected">
        <div class="wallet-card">
            <div class="wallet-icon">🔌</div>
            <p style="color:#888;margin-bottom:15px;">Wallet connect nahi hai</p>
            <div id="tonConnectContainer"></div>
        </div>
    </div>

    <!-- Connected -->
    <div id="connected" class="hidden">
        <div class="wallet-card">
            <div class="wallet-icon">💎</div>
            <div class="wallet-address" id="fullAddress">--</div>
            <div class="wallet-balance" id="balance">0.00 <span>TON</span></div>
            <div style="display:flex;gap:10px;">
                <button class="btn btn-outline" onclick="copyAddress()" style="flex:1;">📋 Copy</button>
                <button class="btn btn-outline" onclick="refreshBalance()" style="flex:1;">🔄 Refresh</button>
            </div>
            <button class="btn btn-disconnect" onclick="disconnectWallet()">🔌 Disconnect</button>
        </div>

        <div class="divider"></div>
        <p style="font-size:.9em;color:#888;text-align:left;">📊 Recent Transactions</p>
        <div class="tx-list" id="txList">
            <div class="tx-item"><span>🎮 Game Win</span><span class="tx-receive">+0.5 TON</span></div>
            <div class="tx-item"><span>🎮 Game Loss</span><span class="tx-send">-0.5 TON</span></div>
            <div class="tx-item"><span>💰 Deposit</span><span class="tx-receive">+5.0 TON</span></div>
        </div>
    </div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
    <a class="nav-item" href="game.html">
        <span class="nav-icon">🎮</span>Game
    </a>
    <a class="nav-item active" href="wallet.html">
        <span class="nav-icon">💎</span>Wallet
    </a>
</div>

<script>
    const firebaseConfig = {
        apiKey:"AIzaSyAQ4sLC47HVflDVQgyAC2gWnUo87wlQitQ",
        authDomain:"mogbf-525cb.firebaseapp.com",
        projectId:"mogbf-525cb",
        storageBucket:"mogbf-525cb.firebasestorage.app",
        messagingSenderId:"451875719799",
        appId:"1:451875719799:web:3980050067ddc5388ed472"
    };
    firebase.initializeApp(firebaseConfig);
    const auth=firebase.auth();
    const db=firebase.firestore();
    const tg=window.Telegram.WebApp;tg.expand();tg.ready();

    auth.onAuthStateChanged(user=>{if(!user)window.location.href='index.html';});

    let tonWallet=null,tonAddress=null;

    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl:'https://daitya-prakasit.github.io/Nbot/tonconnect-manifest.json',
        buttonRootId:'tonConnectContainer'
    });

    tonConnectUI.onStatusChange(async(wallet)=>{
        if(wallet){
            tonWallet=wallet;tonAddress=wallet.account.address;
            document.getElementById('notConnected').classList.add('hidden');
            document.getElementById('connected').classList.remove('hidden');
            document.getElementById('fullAddress').textContent=tonAddress;
            await updateBalance();
            saveTonAddress();
        }else{
            tonWallet=null;tonAddress=null;
            document.getElementById('notConnected').classList.remove('hidden');
            document.getElementById('connected').classList.add('hidden');
        }
    });

    async function updateBalance(){
        try{
            const bal=(Math.random()*90+10).toFixed(2); // Mock
            document.getElementById('balance').innerHTML=bal+' <span>TON</span>';
        }catch(e){}
    }

    function refreshBalance(){updateBalance();if(tg.HapticFeedback)tg.HapticFeedback.impactOccurred('light');}
    function disconnectWallet(){if(tonConnectUI.connected)tonConnectUI.disconnect();}
    function copyAddress(){
        if(tonAddress){
            navigator.clipboard.writeText(tonAddress);
            if(tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success');
            tg.showPopup({title:'Copied!',message:'Wallet address copied',buttons:[{type:'ok'}]});
        }
    }
    async function saveTonAddress(){
        const u=auth.currentUser;if(!u)return;
        try{await db.collection('users').doc(u.uid).update({tonAddress:tonAddress})}catch(e){}
    }
    tg.BackButton.onClick(()=>tg.close());tg.BackButton.show();
</script>
</body>
</html>
